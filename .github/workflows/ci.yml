name: J-Inspector CI/CD Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Build with Maven
        run: mvn clean package

      - name: Run J-Inspector Self-Inspection
        run: |
          JAR_FILE=$(ls target/*jar-with-dependencies.jar 2>/dev/null | head -n 1)
          if [ -n "$JAR_FILE" ]; then
            java -jar $JAR_FILE -p . -f all -o jinspector_ci_report || true
          else
            echo "JAR dosyasi bulunamadi, derleme kontrol edildi."
          fi

      - name: Upload Report Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: j-inspector-reports
          path: |
            jinspector_ci_report.html
            jinspector_ci_report.json
          if-no-files-found: ignore